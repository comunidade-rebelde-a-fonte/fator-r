name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fator_r_test
          POSTGRES_USER: fator_r_owner
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fator_r_owner -d fator_r_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://fator_r_app:ci-app-password@localhost:5432/fator_r_test
      DATABASE_OWNER_URL: postgresql+asyncpg://fator_r_owner:ci-only-password@localhost:5432/fator_r_test
      APP_DB_PASSWORD: ci-app-password
      LANGFUSE_TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests alembic scripts
      - run: uv run ruff format --check src tests alembic scripts
      - run: uv run mypy --strict src
      - run: uv run alembic upgrade head
      - run: uv run python -m fator_r.db_roles
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
